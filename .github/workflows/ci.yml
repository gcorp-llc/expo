name: Cardiani CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Workspace Types
        run: |
          pnpm -F @cardiani/shared type-check
          pnpm -F cardiani-mobile type-check
          pnpm -F @cardiani/web type-check

      - name: Run Lint
        run: pnpm run lint

      - name: Run Unit Tests
        run: pnpm run test

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Build Web Application
        run: pnpm -F @cardiani/web build

  eas-build:
    name: Optional EAS Trigger
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false # Set to true when EAS secrets configured
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Trigger Preview Build
        run: eas build --platform all --profile preview --non-interactive
